<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14141b">
<title>Reta — read it to me</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reta">
<style>
  :root{
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Charter,Georgia,Cambria,serif;
  }
  [data-theme="light"]{
    --bg:#eceef5; --page:#ffffff; --ink:#1a1930; --muted:#6b6a82; --line:#e4e5ef;
    --accent:#5a47e8; --accent-weak:#ece9fd; --cursor:#ffc55c; --cursor-ink:#3a2c00;
    --chunk:rgba(90,71,232,.08); --shadow:0 10px 40px rgba(30,27,60,.10);
  }
  [data-theme="dark"]{
    --bg:#0e0e15; --page:#191922; --ink:#ece9f6; --muted:#9a98b4; --line:#2a2a3a;
    --accent:#8b7bff; --accent-weak:#241f3d; --cursor:#ffc55c; --cursor-ink:#3a2c00;
    --chunk:rgba(139,123,255,.14); --shadow:0 10px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:8px}

  /* ---------- top bar ---------- */
  header{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px calc(12px); padding-top:calc(12px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line); background:var(--page);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto; user-select:none}
  .mark{width:30px; height:30px; display:block}
  .brand h1{font-size:19px; margin:0; letter-spacing:-.3px; font-weight:650}
  .brand .sub{font-size:11.5px; color:var(--muted); margin-top:1px}
  .iconbtn{
    background:transparent; border:1px solid var(--line); color:var(--ink);
    width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
    transition:background .15s,border-color .15s;
  }
  .iconbtn:hover{background:var(--accent-weak); border-color:transparent}
  .iconbtn svg{width:20px;height:20px}
  #installBtn{
    display:none; align-items:center; gap:7px; height:40px; padding:0 14px; border-radius:11px;
    border:1px solid transparent; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px;
  }
  #installBtn.show{display:inline-flex}

  /* ---------- main ---------- */
  main{flex:1; display:flex; flex-direction:column; min-height:0; position:relative}

  /* empty / loader state */
  #intro{flex:1; display:flex; align-items:center; justify-content:center; padding:22px}
  .drop{
    width:100%; max-width:620px; background:var(--page); border:1.5px dashed var(--line);
    border-radius:22px; padding:34px 26px; text-align:center; box-shadow:var(--shadow);
    transition:border-color .15s, background .15s, transform .08s;
  }
  .drop.drag{border-color:var(--accent); background:var(--accent-weak)}
  .drop .big{width:56px;height:56px;margin:0 auto 14px;color:var(--accent)}
  .drop h2{margin:0 0 6px; font-size:22px; letter-spacing:-.4px}
  .drop p{margin:0 auto 20px; color:var(--muted); font-size:14.5px; max-width:42ch; line-height:1.5}
  .drop textarea{
    width:100%; min-height:110px; resize:vertical; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); border-radius:14px; padding:13px 14px;
    font-family:var(--serif); font-size:16px; line-height:1.55; margin-bottom:14px;
  }
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .btn{
    height:46px; padding:0 20px; border-radius:13px; font-weight:600; font-size:15px;
    border:1px solid var(--line); background:var(--page); color:var(--ink);
    display:inline-flex; align-items:center; gap:8px; transition:transform .06s, background .15s;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent); color:#fff; border-color:transparent}
  .btn svg{width:18px;height:18px}
  .hint{margin-top:16px; font-size:12.5px; color:var(--muted)}
  .hint b{color:var(--ink); font-weight:600}

  /* reading surface */
  #reader{flex:1; overflow:auto; display:none; scroll-behavior:smooth; padding:26px 20px 30px}
  #reader.on{display:block}
  .doc{
    max-width:68ch; margin:0 auto; font-family:var(--serif);
    font-size:clamp(18px,1.9vw,21px); line-height:1.75; white-space:pre-wrap; word-wrap:break-word;
  }
  .doc .w{border-radius:5px; transition:background-color .05s}
  .doc .chunk-on{background:var(--chunk)}
  .doc .word-on{background:var(--cursor); color:var(--cursor-ink); box-shadow:0 0 0 3px var(--cursor)}
  .filemeta{max-width:68ch; margin:0 auto 16px; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px}
  .filemeta .tag{background:var(--accent-weak); color:var(--accent); padding:3px 9px; border-radius:999px; font-weight:600; font-size:12px}

  /* ---------- player bar ---------- */
  #player{
    display:none; border-top:1px solid var(--line); background:var(--page);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); z-index:20;
  }
  #player.on{display:block}
  .scrub{height:7px; background:var(--line); border-radius:999px; overflow:hidden; cursor:pointer; margin:4px 2px 12px}
  .scrub .fill{height:100%; width:0%; background:var(--accent); border-radius:999px; transition:width .1s linear}
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .transport{display:flex; align-items:center; gap:8px}
  .pbtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--page);color:var(--ink);display:grid;place-items:center}
  .pbtn.play{width:56px;height:56px;background:var(--accent);border-color:transparent;color:#fff;border-radius:16px}
  .pbtn svg{width:22px;height:22px}
  .pbtn.play svg{width:26px;height:26px}
  .pbtn[disabled]{opacity:.4; cursor:default}
  .seg{display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 12px;border-radius:9px}
  .seg button.active{background:var(--accent); color:#fff}
  select, .speed{
    height:40px; border:1px solid var(--line); background:var(--page); color:var(--ink);
    border-radius:11px; padding:0 10px; font-size:13.5px; font-family:inherit; max-width:190px;
  }
  .voicewrap{display:flex; align-items:center; gap:8px; min-width:0}
  .voicewrap select{max-width:210px; text-overflow:ellipsis}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--accent-weak);color:var(--accent);white-space:nowrap}
  .badge.warn{background:#fff2d6;color:#8a5a00}
  [data-theme="dark"] .badge.warn{background:#3a2c05;color:#ffcf6e}
  .speedwrap{display:flex;align-items:center;gap:8px}
  .speedwrap input{width:110px; accent-color:var(--accent)}
  .speedwrap .val{font-variant-numeric:tabular-nums; font-weight:600; font-size:13px; color:var(--muted); width:42px; text-align:right}
  .spacer{flex:1 1 auto}
  .txtbtn{background:transparent;border:1px solid var(--line);height:40px;padding:0 12px;border-radius:11px;color:var(--ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
  .txtbtn svg{width:16px;height:16px}
  .txtbtn.mark svg{color:var(--accent)}

  /* ---------- bookmarks panel ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,10,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .scrim.on{opacity:1;pointer-events:auto}
  #bm{
    position:fixed;top:0;right:0;height:100%;width:min(400px,90vw);background:var(--page);
    box-shadow:var(--shadow);transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
    z-index:31;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  #bm.on{transform:none}
  .bm-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
  .bm-head h3{margin:0;font-size:17px;margin-right:auto}
  .bm-list{flex:1;overflow:auto;padding:10px 12px}
  .bm-empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px;line-height:1.6}
  .bm-item{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;background:var(--bg)}
  .bm-item .name{font-weight:650;font-size:14.5px;border:0;background:transparent;color:var(--ink);width:100%;padding:2px 0;font-family:inherit}
  .bm-item .name:focus{outline:none;border-bottom:2px solid var(--accent)}
  .bm-item .snip{color:var(--muted);font-size:12.5px;line-height:1.45;margin:4px 0 10px;max-height:3.2em;overflow:hidden}
  .bm-item .acts{display:flex;gap:8px;flex-wrap:wrap}
  .bm-item .acts button{font-size:12.5px;font-weight:600;border-radius:9px;border:1px solid var(--line);background:var(--page);color:var(--ink);padding:6px 11px;display:inline-flex;align-items:center;gap:6px}
  .bm-item .acts .go{background:var(--accent);color:#fff;border-color:transparent}
  .bm-item .acts .del{margin-left:auto;color:#c0392b;border-color:transparent;background:transparent}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:var(--page);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;box-shadow:var(--shadow)
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    .voicewrap select{max-width:140px}
    .brand .sub{display:none}
    .speedwrap input{width:84px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-theme="light">

<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3c2cad"/><stop offset="1" stop-color="#6d4ce8"/></linearGradient></defs>
      <rect width="100" height="100" rx="24" fill="url(#g)"/>
      <g fill="#f7f6fb"><rect x="18" y="42" width="7" height="16" rx="3.5"/>
      <rect x="31" y="34" width="7" height="32" rx="3.5"/><rect x="44" y="26" width="7" height="48" rx="3.5"/>
      <rect x="70" y="34" width="7" height="32" rx="3.5"/><rect x="83" y="42" width="7" height="16" rx="3.5"/></g>
      <rect x="57" y="20" width="7" height="60" rx="3.5" fill="#ffc55c"/>
    </svg>
    <div><h1>Reta</h1><div class="sub">read it to me</div></div>
  </div>
  <button id="installBtn" title="Install Reta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
    Install
  </button>
  <button class="iconbtn" id="bmOpen" title="Bookmarks" aria-label="Bookmarks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg>
  </button>
  <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle light or dark theme">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <section id="intro">
    <div class="drop" id="drop">
      <svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
      <h2>Drop a file, or paste your text</h2>
      <p>Reta reads it out loud in the voice you choose, and follows along word by word.</p>
      <textarea id="paste" placeholder="Paste or type text here…" aria-label="Paste text to read"></textarea>
      <div class="row">
        <button class="btn primary" id="readPaste">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Read this
        </button>
        <button class="btn" id="pickFile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 001 1h4"/><path d="M5 3h9l6 6v11a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/></svg> Open a file
        </button>
      </div>
      <div class="hint"><b>Reads:</b> plain text, Markdown, PDF, and Word (.docx). Everything stays on your device.</div>
    </div>
  </section>

  <section id="reader">
    <div class="filemeta" id="filemeta" style="display:none"></div>
    <div class="doc" id="doc"></div>
  </section>
</main>

<footer id="player">
  <div class="scrub" id="scrub" title="Tap to read from here"><div class="fill" id="fill"></div></div>
  <div class="controls">
    <div class="transport">
      <button class="pbtn" id="restart" title="Start over" aria-label="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v6h6"/><path d="M3.5 10a9 9 0 11.5 5"/></svg>
      </button>
      <button class="pbtn play" id="play" title="Play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="pbtn" id="stop" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>

    <div class="seg" role="group" aria-label="Voice type">
      <button id="segF" class="active">Female</button>
      <button id="segM">Male</button>
      <button id="segA">All</button>
    </div>

    <div class="voicewrap">
      <select id="voice" aria-label="Choose a voice"></select>
      <span class="badge" id="voiceBadge" style="display:none"></span>
    </div>

    <div class="speedwrap" title="Speed">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="M12 8v4l3 2"/><circle cx="12" cy="13" r="8"/></svg>
      <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
      <span class="val" id="speedVal">1.0×</span>
    </div>

    <div class="spacer"></div>

    <button class="txtbtn mark" id="bmAdd" title="Bookmark this text and spot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg> Bookmark
    </button>
    <button class="txtbtn" id="newDoc" title="Load different text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> New
    </button>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside id="bm" aria-label="Saved bookmarks">
  <div class="bm-head">
    <h3>Bookmarks</h3>
    <button class="iconbtn" id="bmClose" aria-label="Close bookmarks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="bm-list" id="bmList"></div>
</aside>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept=".txt,.md,.markdown,.csv,.log,.rtf,.json,.pdf,.docx,text/*" hidden>

<script src="pdf.min.js" defer></script>
<script src="mammoth.browser.min.js" defer></script>
<script>
(function(){
  "use strict";
  const $ = (id)=>document.getElementById(id);

  /* ---------- storage: window.storage -> localStorage -> memory ---------- */
  const mem = {};
  const Store = {
    async get(k){
      try{ if(window.storage){ const r = await window.storage.get(k); return r&&r.value!=null ? JSON.parse(r.value) : null; } }catch(e){}
      try{ const v = localStorage.getItem(k); return v!=null ? JSON.parse(v) : null; }catch(e){}
      return (k in mem) ? mem[k] : null;
    },
    async set(k,val){
      const s = JSON.stringify(val);
      try{ if(window.storage){ await window.storage.set(k, s); return; } }catch(e){}
      try{ localStorage.setItem(k, s); return; }catch(e){}
      mem[k]=val;
    }
  };

  /* ---------- theme ---------- */
  const body=document.body;
  Store.get('reta_theme').then(t=>{ if(t) body.dataset.theme=t; updateThemeIcon(); });
  function updateThemeIcon(){
    const dark = body.dataset.theme==='dark';
    $('themeIcon').innerHTML = dark
      ? '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/>';
  }
  $('themeBtn').onclick=()=>{ body.dataset.theme = body.dataset.theme==='dark'?'light':'dark'; updateThemeIcon(); Store.set('reta_theme', body.dataset.theme); };

  /* ---------- toast ---------- */
  let toastT; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200); }

  /* ---------- voices ---------- */
  const synth = window.speechSynthesis;
  let voices=[], filterGender='female', currentVoice=null;
  const FEMALE=['female','samantha','victoria','karen','moira','tessa','fiona','veena','kate','serena','allison','ava','susan','zoe','kathy','vicki','sara','sarah','zira','aria','jenny','jane','nora','hazel','catherine','linda','heather','michelle','amy','emma','joanna','salli','kimberly','kendra','ivy','olivia','nicky','martha','clara','sofia','luciana','paulina','ana','marta','helena','google uk english female','google us english'];
  const MALE=['male','daniel','alex','fred','tom','oliver','gordon','lee','rishi','aaron','arthur','bruce','ralph','david','mark','guy','george','james','john','paul','richard','eric','brian','matthew','justin','joey','kevin','diego','jorge','carlos','enrique','miguel','google uk english male'];
  function genderOf(v){
    const n=(v.name||'').toLowerCase();
    for(const k of MALE) if(n.includes(k)) return 'male';
    for(const k of FEMALE) if(n.includes(k)) return 'female';
    return 'unknown';
  }
  function loadVoices(){
    voices = synth.getVoices()||[];
    voices.forEach(v=>{ v._g=genderOf(v); });
    populateVoices();
  }
  function preferredLang(){ return (navigator.language||'en').toLowerCase(); }
  function populateVoices(){
    const sel=$('voice'); const lang=preferredLang(); const base=lang.split('-')[0];
    let list = voices.filter(v=> filterGender==='all' ? true : v._g===filterGender);
    if(!list.length && filterGender!=='all'){ // graceful: device has none tagged this gender
      list = voices.slice();
    }
    // sort: matching language first, offline (localService) first, then name
    list.sort((a,b)=>{
      const la=(a.lang||'').toLowerCase().startsWith(base)?0:1;
      const lb=(b.lang||'').toLowerCase().startsWith(base)?0:1;
      if(la!==lb) return la-lb;
      const oa=a.localService?0:1, ob=b.localService?0:1;
      if(oa!==ob) return oa-ob;
      return (a.name||'').localeCompare(b.name||'');
    });
    sel.innerHTML='';
    list.forEach(v=>{
      const o=document.createElement('option');
      o.value=v.name;
      o.textContent = v.name + ' · ' + (v.lang||'') + (v.localService?'':' (online)');
      sel.appendChild(o);
    });
    // keep current if still present, else pick first
    const keep = list.find(v=>currentVoice&&v.name===currentVoice.name);
    currentVoice = keep || list[0] || null;
    if(currentVoice) sel.value=currentVoice.name;
    updateVoiceBadge();
  }
  function updateVoiceBadge(){
    const b=$('voiceBadge');
    if(!currentVoice){ b.style.display='none'; return; }
    b.style.display='inline-block';
    if(currentVoice.localService){ b.className='badge'; b.textContent='works offline'; }
    else { b.className='badge warn'; b.textContent='needs internet'; }
  }
  $('voice').onchange=(e)=>{ currentVoice = voices.find(v=>v.name===e.target.value)||currentVoice; updateVoiceBadge(); if(state!=='idle'){ restartFromCurrent(); } };
  function setGender(g,btn){ filterGender=g; ['segF','segM','segA'].forEach(id=>$(id).classList.remove('active')); btn.classList.add('active'); populateVoices(); if(state!=='idle'){ restartFromCurrent(); } }
  $('segF').onclick=(e)=>setGender('female',e.currentTarget);
  $('segM').onclick=(e)=>setGender('male',e.currentTarget);
  $('segA').onclick=(e)=>setGender('all',e.currentTarget);
  loadVoices();
  if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=loadVoices;
  setTimeout(loadVoices, 500); setTimeout(loadVoices, 1500);

  /* ---------- speed ---------- */
  let rate=1;
  $('speed').oninput=(e)=>{ rate=parseFloat(e.target.value); $('speedVal').textContent=rate.toFixed(1)+'×'; };
  Store.get('reta_rate').then(r=>{ if(r){ rate=r; $('speed').value=r; $('speedVal').textContent=r.toFixed(1)+'×'; } });
  $('speed').addEventListener('change',()=>Store.set('reta_rate',rate));

  /* ---------- text + tokens + chunks ---------- */
  let fullText='', tokens=[], chunks=[], curFileName='';
  const CHUNK_MAX=170, CHUNK_MIN=60;

  function buildTokens(text){
    const doc=$('doc'); doc.innerHTML=''; tokens=[];
    const re=/\S+/g; let last=0,m;
    const frag=document.createDocumentFragment();
    while((m=re.exec(text))){
      if(m.index>last) frag.appendChild(document.createTextNode(text.slice(last,m.index)));
      const s=document.createElement('span'); s.className='w'; s.textContent=m[0];
      const start=m.index, end=m.index+m[0].length;
      s._s=start; s._e=end;
      frag.appendChild(s);
      tokens.push(s);
      last=end;
    }
    if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    doc.appendChild(frag);
  }
  function buildChunks(text){
    chunks=[]; const n=text.length; let start=0,j=0;
    while(j<n){
      const c=text[j]; j++;
      const atEnd=(c==='.'||c==='!'||c==='?'||c==='…'||c===';'||c===':') && (j>=n||/\s/.test(text[j]));
      const atNL=(c==='\n');
      const len=j-start;
      if(len>=CHUNK_MAX && /\s/.test(c)){ chunks.push({base:start,len:len}); start=j; }
      else if((atEnd||atNL) && len>=CHUNK_MIN){ chunks.push({base:start,len:len}); start=j; }
    }
    if(start<n) chunks.push({base:start,len:n-start});
    // map tokens -> chunk index
    let ci=0;
    tokens.forEach(t=>{
      while(ci<chunks.length-1 && t._s>=chunks[ci].base+chunks[ci].len) ci++;
      t._c=ci;
    });
  }
  function chunkText(i){ return fullText.substr(chunks[i].base, chunks[i].len); }
  function chunkForOffset(off){ for(let i=0;i<chunks.length;i++){ if(off < chunks[i].base+chunks[i].len) return i; } return 0; }
  function tokenForOffset(off){ for(let i=0;i<tokens.length;i++){ if(tokens[i]._e>off) return i; } return tokens.length; }

  /* ---------- playback engine ---------- */
  let state='idle';            // idle | playing | paused
  let curChunk=0, hlPtr=0, gen=0, curChunkEl=-1;
  let manualPause=false;

  function clearWord(){ const a=document.querySelector('.word-on'); if(a) a.classList.remove('word-on'); }
  function clearChunk(){ document.querySelectorAll('.chunk-on').forEach(e=>e.classList.remove('chunk-on')); curChunkEl=-1; }
  function markChunk(ci){ if(ci===curChunkEl) return; clearChunk(); curChunkEl=ci; tokens.forEach(t=>{ if(t._c===ci) t.classList.add('chunk-on'); }); }
  function keepInView(el){
    const r=$('reader'); const er=el.getBoundingClientRect(); const rr=r.getBoundingClientRect();
    if(er.top < rr.top+70 || er.bottom > rr.bottom-70){ el.scrollIntoView({block:'center', behavior:'smooth'}); }
  }
  function highlightAt(abs){
    while(hlPtr<tokens.length && tokens[hlPtr]._e<=abs) hlPtr++;
    if(hlPtr>=tokens.length) return;
    const t=tokens[hlPtr];
    clearWord(); t.classList.add('word-on'); keepInView(t);
    const total=fullText.length||1;
    $('fill').style.width=Math.min(100,(abs/total)*100)+'%';
  }

  function speakChunk(){
    if(state!=='playing') return;
    if(curChunk>=chunks.length){ finish(); return; }
    markChunk(curChunk);
    const myGen=gen;
    const u=new SpeechSynthesisUtterance(chunkText(curChunk));
    if(currentVoice){ u.voice=currentVoice; u.lang=currentVoice.lang; }
    u.rate=rate; u.pitch=1;
    const base=chunks[curChunk].base;
    u.onboundary=(e)=>{ if(myGen!==gen) return; const ci=(e.charIndex!=null?e.charIndex:0); highlightAt(base+ci); };
    u.onend=()=>{ if(myGen!==gen || state!=='playing') return; curChunk++; speakChunk(); };
    u.onerror=()=>{ if(myGen!==gen) return; /* skip broken chunk */ curChunk++; if(state==='playing') speakChunk(); };
    synth.speak(u);
  }
  function startFrom(offset){
    gen++; synth.cancel();
    curChunk=chunkForOffset(offset); hlPtr=tokenForOffset(offset);
    state='playing'; manualPause=false; setPlayIcon(true);
    $('fill').style.width=Math.min(100,(offset/(fullText.length||1))*100)+'%';
    // slight delay lets cancel settle on some browsers
    setTimeout(speakChunk, 60);
  }
  function restartFromCurrent(){
    const off = currentAbs();
    startFrom(off);
  }
  function currentAbs(){ return (hlPtr<tokens.length)? tokens[hlPtr]._s : 0; }
  function finish(){ gen++; state='idle'; manualPause=false; setPlayIcon(false); clearWord(); $('fill').style.width='100%'; }

  function play(){
    if(!tokens.length) return;
    if(state==='paused'){ synth.resume(); state='playing'; manualPause=false; setPlayIcon(true); return; }
    if(state==='playing'){ return; }
    // start from beginning or from current highlight if user seeked
    startFrom(currentAbs());
  }
  function pause(){ if(state!=='playing') return; manualPause=true; synth.pause(); state='paused'; setPlayIcon(false); }
  function stop(){ gen++; synth.cancel(); state='idle'; manualPause=false; setPlayIcon(false); clearWord(); clearChunk(); hlPtr=0; curChunk=0; $('fill').style.width='0%'; }

  function setPlayIcon(playing){
    $('playIcon').innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $('play').title = playing?'Pause':'Play';
  }
  $('play').onclick=()=>{ if(state==='playing') pause(); else play(); };
  $('stop').onclick=stop;
  $('restart').onclick=()=>{ hlPtr=0; curChunk=0; startFrom(0); };
  $('scrub').onclick=(e)=>{ if(!tokens.length) return; const r=e.currentTarget.getBoundingClientRect(); const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); const off=Math.floor(ratio*fullText.length); hlPtr=tokenForOffset(off); highlightAt(off); startFrom(off); };

  // Chrome long-speech keep-alive (harmless nudge; skipped while user-paused)
  setInterval(()=>{ try{ if(state==='playing' && !manualPause && synth.paused){ synth.resume(); } }catch(e){} }, 9000);

  /* ---------- load text into reader ---------- */
  function showReader(){ $('intro').style.display='none'; $('reader').classList.add('on'); $('player').classList.add('on'); }
  function showIntro(){ stop(); $('reader').classList.remove('on'); $('player').classList.remove('on'); $('intro').style.display='flex'; }
  function loadText(text, name){
    stop();
    fullText=(text||'').replace(/\r\n/g,'\n');
    if(!fullText.trim()){ toast('That looks empty — nothing to read.'); return; }
    curFileName=name||'';
    buildTokens(fullText); buildChunks(fullText);
    const meta=$('filemeta');
    if(name){ meta.style.display='flex'; meta.innerHTML='<span class="tag">'+escapeHtml(name.split('.').pop().toUpperCase())+'</span><span>'+escapeHtml(name)+'</span>'; }
    else meta.style.display='none';
    $('reader').scrollTop=0;
    showReader();
    hlPtr=0; curChunk=0;
  }
  function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ---------- file reading ---------- */
  async function readFile(file){
    const name=file.name||'text'; const ext=(name.split('.').pop()||'').toLowerCase();
    try{
      if(ext==='pdf'){
        if(typeof pdfjsLib==='undefined'){ toast('PDF reader unavailable offline on first run.'); return; }
        toast('Reading PDF…');
        pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
        const buf=await file.arrayBuffer();
        const pdf=await pdfjsLib.getDocument({data:buf}).promise;
        let out='';
        for(let p=1;p<=pdf.numPages;p++){
          const page=await pdf.getPage(p);
          const tc=await page.getTextContent();
          let lastY=null, line='';
          tc.items.forEach(it=>{ const y=it.transform[5]; if(lastY!==null && Math.abs(y-lastY)>3){ out+=line.trim()+'\n'; line=''; } line+=it.str+' '; lastY=y; });
          out+=line.trim()+'\n\n';
        }
        loadText(out, name);
      } else if(ext==='docx'){
        if(typeof mammoth==='undefined'){ toast('Word reader unavailable offline on first run.'); return; }
        toast('Reading Word doc…');
        const buf=await file.arrayBuffer();
        const res=await mammoth.extractRawText({arrayBuffer:buf});
        loadText(res.value, name);
      } else if(ext==='rtf'){
        const t=await file.text();
        loadText(rtfToText(t), name);
      } else {
        const t=await file.text();
        loadText(t, name);
      }
    }catch(err){ console.error(err); toast('Sorry — could not read that file.'); }
  }
  function rtfToText(rtf){
    return rtf.replace(/\\par[d]?/g,'\n').replace(/\{\\[^}]*\}/g,'').replace(/\\[a-z]+-?\d* ?/g,'').replace(/[{}]/g,'').replace(/\n{3,}/g,'\n\n').trim();
  }

  /* ---------- inputs: pick, paste, drag-drop ---------- */
  $('pickFile').onclick=()=>$('fileInput').click();
  $('fileInput').onchange=(e)=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=''; };
  $('readPaste').onclick=()=>{ const t=$('paste').value; if(t.trim()) loadText(t,''); else toast('Type or paste something first.'); };
  $('newDoc').onclick=()=>{ $('paste').value=''; showIntro(); };

  const drop=$('drop');
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); if(document.getElementById('intro').style.display!=='none') drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  document.addEventListener('drop',e=>{
    const dt=e.dataTransfer; if(!dt) return;
    if(dt.files && dt.files.length){ readFile(dt.files[0]); return; }
    const t=dt.getData('text'); if(t && t.trim()) loadText(t,'');
  });
  // paste text anywhere (when not typing in the textarea)
  document.addEventListener('paste',e=>{
    if(e.target===$('paste')) return;
    const t=(e.clipboardData||window.clipboardData).getData('text');
    if(t && t.trim()){ loadText(t,''); }
  });

  /* ---------- bookmarks ---------- */
  const BM_KEY='reta_bookmarks';
  let bookmarks=[];
  Store.get(BM_KEY).then(b=>{ bookmarks=Array.isArray(b)?b:[]; renderBookmarks(); });
  function saveBookmarks(){ Store.set(BM_KEY, bookmarks); }
  function openBM(){ $('bm').classList.add('on'); $('scrim').classList.add('on'); }
  function closeBM(){ $('bm').classList.remove('on'); $('scrim').classList.remove('on'); }
  $('bmOpen').onclick=openBM; $('bmClose').onclick=closeBM; $('scrim').onclick=closeBM;

  $('bmAdd').onclick=()=>{
    if(!fullText.trim()){ toast('Load some text first.'); return; }
    const off=currentAbs();
    const snippet=fullText.slice(off, off+90).replace(/\s+/g,' ').trim();
    const nameGuess = curFileName || (fullText.trim().slice(0,40).replace(/\s+/g,' ')+'…');
    bookmarks.unshift({ id:Date.now(), name:nameGuess, text:fullText, offset:off, fileName:curFileName, snippet, created:Date.now() });
    saveBookmarks(); renderBookmarks();
    toast('Bookmarked' + (off>0?' at your spot':''));
  };
  function renderBookmarks(){
    const list=$('bmList');
    if(!bookmarks.length){ list.innerHTML='<div class="bm-empty">No bookmarks yet.<br>Open something, then tap <b>Bookmark</b> to save it — Reta remembers the text and exactly where you paused.</div>'; return; }
    list.innerHTML='';
    bookmarks.forEach(bm=>{
      const div=document.createElement('div'); div.className='bm-item';
      const pct = bm.text&&bm.text.length? Math.round((bm.offset/bm.text.length)*100):0;
      div.innerHTML =
        '<input class="name" value="'+escapeHtml(bm.name)+'" aria-label="Bookmark name">'+
        '<div class="snip">…'+escapeHtml(bm.snippet||'')+'…</div>'+
        '<div class="acts">'+
          '<button class="go">▶ Resume'+(pct?(' · '+pct+'%'):'')+'</button>'+
          '<button class="open">Open</button>'+
          '<button class="del">Delete</button>'+
        '</div>';
      const nameEl=div.querySelector('.name');
      nameEl.addEventListener('change',()=>{ bm.name=nameEl.value.trim()||bm.name; saveBookmarks(); });
      div.querySelector('.go').onclick=()=>{ loadText(bm.text, bm.fileName); closeBM(); hlPtr=tokenForOffset(bm.offset); startFrom(bm.offset); };
      div.querySelector('.open').onclick=()=>{ loadText(bm.text, bm.fileName); closeBM(); hlPtr=tokenForOffset(bm.offset||0); if(bm.offset) highlightAt(bm.offset); };
      div.querySelector('.del').onclick=()=>{ bookmarks=bookmarks.filter(x=>x.id!==bm.id); saveBookmarks(); renderBookmarks(); };
      list.appendChild(div);
    });
  }

  /* ---------- install (PWA) ---------- */
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e; $('installBtn').classList.add('show'); });
  $('installBtn').onclick=async()=>{
    if(deferredPrompt){ deferredPrompt.prompt(); const {outcome}=await deferredPrompt.userChoice; if(outcome==='accepted'){ $('installBtn').classList.remove('show'); } deferredPrompt=null; }
    else {
      const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
      toast(iOS ? 'On iPhone: Share → Add to Home Screen' : 'Use your browser menu → Install app');
    }
  };
  window.addEventListener('appinstalled',()=>{ $('installBtn').classList.remove('show'); toast('Reta installed'); });

  /* ---------- register service worker ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }

  // keyboard: space toggles play when not typing
  document.addEventListener('keydown',e=>{
    if(e.code==='Space' && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='INPUT' && $('player').classList.contains('on')){
      e.preventDefault(); if(state==='playing') pause(); else play();
    }
  });
  // stop speech if the page is closing
  window.addEventListener('beforeunload',()=>{ try{ synth.cancel(); }catch(e){} });
})();
</script>
</body>
</html>
